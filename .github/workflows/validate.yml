name: Validate build pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Check internal links, images, and accessible markup
        run: python3 scripts/check_site.py
      # Validate build data and required pages without overwriting hand-customized HTML.
      - name: Validate build data and required pages
        run: |
          python3 - <<'PY'
          from scripts.build import ROOT, outputs
          generated = outputs()
          missing = [str(path.relative_to(ROOT)) for path in generated if not path.is_file()]
          if missing:
              raise SystemExit("Missing required build pages: " + ", ".join(missing))
          print(f"Validated build data and presence of {len(generated)} build pages")
          PY
      - run: git diff --check

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hunter Community · Custom Preview</title><link rel="stylesheet" href="../assets/arsenal-nav.css"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11131b;color:#f5e7d6;font:16px/1.5 system-ui}main{max-width:850px;margin:35px auto;padding:20px}h1,h2{color:#ffca84}.panel{background:#1c1b22;border:1px solid #9b633e;border-radius:16px;padding:22px;margin:18px 0}button,input,textarea{font:inherit}button{background:#533522;border:1px solid #b87a4c;color:#ffe2bc;padding:9px 14px;border-radius:9px;cursor:pointer;margin:4px}button:hover{background:#785034}button:disabled{opacity:.45}input,textarea{width:100%;padding:12px;background:#101218;border:1px solid #72513b;color:white;border-radius:8px;margin:7px 0}textarea{min-height:90px}article{border-top:1px solid #5a4336;padding:16px 0;white-space:pre-wrap}.muted{color:#b6aaa0;font-size:.9rem}.error{color:#ffac9e}.success{color:#a9e4b0}.hidden{display:none}a{color:#ffca84}</style><script id="always-start-at-top">(()=>{try{if("scrollRestoration" in history)history.scrollRestoration="manual"}catch(_){}const top=()=>window.scrollTo(0,0);top();window.addEventListener("pageshow",top);window.addEventListener("load",top)})();</script></head><body><nav class="unified-nav" aria-label="Site menu"><a class="arsenal-brand" href="../">⚔ OUTLANDERS ARSENAL</a><details><summary aria-label="Open navigation menu">☰</summary><div class="menu-links"><a href="../">Home</a><a href="../builder/">Builder</a><a href="../builds/">Build Library</a><a href="../guide/">Guides</a><a href="./">Community</a></div></details></nav><main><h1>⚔ Hunter Community</h1><p class="muted">Custom comments preview — existing live Giscus remains unchanged. <a href="./">Return to live comments</a></p><div class="panel"><h2>Hunter Sign-in</h2><p id="status" aria-live="polite">Loading…</p><div id="auth"><button id="github">Sign in with GitHub</button><button id="google">Sign in with Google</button><form id="email-form"><label>Email address<input id="email" type="email" required autocomplete="email"></label><button type="submit">Email me a sign-in link</button></form></div><button id="logout" class="hidden">Sign out</button></div><div class="panel"><h2>💬 Feedback</h2><form id="post-form"><label>Your comment<textarea id="message" maxlength="3000" required placeholder="Share suggestions or report a bug"></textarea></label><button id="post" type="submit">Post comment</button></form><p id="feedback" aria-live="polite"></p><div id="comments"></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT_URL='REPLACE_WITH_SUPABASE_PROJECT_URL',PUBLISHABLE_KEY='REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY';
const $=id=>document.getElementById(id), ready=PROJECT_URL.startsWith('https://')&&!PUBLISHABLE_KEY.startsWith('REPLACE_');
const status=$('status'), feedback=$('feedback');let client=null,user=null;
const say=(msg,error=false)=>{feedback.textContent=msg;feedback.className=error?'error':'success'};
if(!ready){status.textContent='Setup required: connect a Supabase project before testing sign-in and comments.';$('auth').classList.add('hidden');$('post-form').classList.add('hidden')}else{
 client=createClient(PROJECT_URL,PUBLISHABLE_KEY);const base=location.origin+location.pathname;
 const refreshAuth=async()=>{const {data:{user:u}}=await client.auth.getUser();user=u;status.textContent=user?'Signed in as '+(user.user_metadata?.user_name||user.email||'hunter'):'Sign in to post or manage your own comments.';$('auth').classList.toggle('hidden',!!user);$('logout').classList.toggle('hidden',!user);$('post-form').classList.toggle('hidden',!user);await load()};
 $('github').onclick=()=>client.auth.signInWithOAuth({provider:'github',options:{redirectTo:base}});
 $('google').onclick=()=>client.auth.signInWithOAuth({provider:'google',options:{redirectTo:base}});
 $('email-form').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithOtp({email:$('email').value,options:{emailRedirectTo:base}});say(error?error.message:'Check your email for a sign-in link.',!!error)};
 $('logout').onclick=async()=>{await client.auth.signOut();await refreshAuth()};
 $('post-form').onsubmit=async e=>{e.preventDefault();const body=$('message').value.trim();if(!body||!user)return;const {error}=await client.from('community_comments').insert({body,user_id:user.id,display_name:user.user_metadata?.user_name||user.user_metadata?.full_name||user.email?.split('@')[0]||'Hunter'});if(error)return say(error.message,true);$('message').value='';say('Comment posted!');await load()};
 async function load(){const target=$('comments');target.replaceChildren();const {data,error}=await client.from('community_comments').select('id,user_id,display_name,body,created_at').order('created_at',{ascending:false}).limit(100);if(error){target.textContent='Could not load comments: '+error.message;return}if(!data.length){target.textContent='No comments yet. Be the first hunter to share feedback!';return}for(const c of data){const article=document.createElement('article'),head=document.createElement('div'),body=document.createElement('p');head.className='muted';head.textContent=c.display_name+' · '+new Date(c.created_at).toLocaleString();body.textContent=c.body;article.append(head,body);if(user&&user.id===c.user_id){const edit=document.createElement('button'),del=document.createElement('button');edit.textContent='Edit';del.textContent='Delete';edit.onclick=async()=>{const next=prompt('Edit your comment:',c.body);if(next===null||!next.trim()||next.length>3000)return;const {error}=await client.from('community_comments').update({body:next.trim()}).eq('id',c.id);if(error)say(error.message,true);else await load()};del.onclick=async()=>{if(!confirm('Delete this comment permanently?'))return;const {error}=await client.from('community_comments').delete().eq('id',c.id);if(error)say(error.message,true);else await load()};article.append(edit,del)}target.append(article)}}
 client.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));await refreshAuth();
}
</script></body></html>
